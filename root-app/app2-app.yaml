apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-2-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jatuwut/test_demo.git/ 
    targetRevision: argocd-2
    path: apps/nginx-app-2
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

