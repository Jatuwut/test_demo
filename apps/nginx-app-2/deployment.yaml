apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app-2
  namespace: test-3
  labels:
    app: nginx-app-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-app-2
  template:
    metadata:
      labels:
        app: nginx-app-2
    spec:
      containers:
        - name: nginx
          image: nginx:latest  #1.23.4# <- Image Updater will update this tag
          ports:
            - containerPort: 80
